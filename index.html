const { useState, useEffect, useCallback, useRef } = React;

let db = null;
let fbFns = null;

const storage = {
  async get(key) {
    const ref = fbFns.doc(db, "data", key);
    const snap = await fbFns.getDoc(ref);
    if (!snap.exists()) return null;
    return { value: snap.data().value };
  },
  async set(key, value) {
    const ref = fbFns.doc(db, "data", key);
    await fbFns.setDoc(ref, { value });
    return { key, value };
  },
  async delete(key) {
    const ref = fbFns.doc(db, "data", key);
    await fbFns.deleteDoc(ref);
    return { key, deleted: true };
  },
};

function useFonts() {
  useEffect(() => {
    if (document.getElementById("dt-fonts")) return;
    const link = document.createElement("link");
    link.id = "dt-fonts";
    link.rel = "stylesheet";

function normalizeDigits(str) {
  if (!str) return str;
  const map = {
    "٠": "0", "١": "1", "٢": "2", "٣": "3", "٤": "4", "٥": "5", "٦": "6", "٧": "7", "٨": "8", "٩": "9",
    "۰": "0", "۱": "1", "۲": "2", "۳": "3", "۴": "4", "۵": "5", "۶": "6", "۷": "7", "۸": "8", "۹": "9",
  };
  return String(str).split("").map((ch) => map[ch] || ch).join("");
}

function fmtMoney(n) {
  const v = Number(n) || 0;
  return v.toLocaleString("en-US") + " د.ع";
}
function fmtDate(d) {
  if (!d) return "—";
  const dt = new Date(d);
  if (isNaN(dt)) return d;
  const dd = String(dt.getDate()).padStart(2, "0");
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  return `${dd}/${mm}/${dt.getFullYear()}`;
}
function todayStr() { return new Date().toISOString().slice(0, 10); }
function fmtDateTime(t) {
  if (!t) return "—";
  const dt = new Date(t);
  const dd = String(dt.getDate()).padStart(2, "0");
  const mm = String(dt.getMonth() + 1).padStart(2, "0");
  let h = dt.getHours();
  const ampm = h >= 12 ? "م" : "ص";
  h = h % 12; if (h === 0) h = 12;
  const min = String(dt.getMinutes()).padStart(2, "0");
  return `${dd}/${mm} ${h}:${min} ${ampm}`;
}
function entrySortKey(e) { return e.editedAt || e.id; }
function numberMapFor(entries) {
  const map = {};
  [...(entries || [])].sort((a, b) => a.id - b.id).forEach((e, i) => { map[e.id] = i + 1; });
  return map;
}
function applyHistoryControls(baseHistory, { search, filter, sort }) {
  let list = baseHistory;
  if (filter && filter !== "all") list = list.filter((e) => e.type === filter);
  if (search && search.trim()) {
    const q = search.trim().toLowerCase();
    list = list.filter((e) => (e.desc || "").toLowerCase().includes(q));
  }
  if (sort === "amountDesc") list = [...list].sort((a, b) => b.amount - a.amount);
  else if (sort === "amountAsc") list = [...list].sort((a, b) => a.amount - b.amount);
  return list;
}
function HistoryControls({ search, setSearch, filter, setFilter, sort, setSort, color }) {
  return (
    <div className="mb-2 space-y-2">
      <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="بحث بالوصف..." className="w-full px-3 py-2 rounded-lg border outline-none text-sm bg-white" style={{ borderColor: COLORS.line }} />
      <div className="flex gap-1 flex-wrap">
        {[{ v: "all", l: "الكل" }, { v: "purchase", l: "شراء" }, { v: "payment", l: "تسديد" }, { v: "return", l: "ترجيع" }].map((f) => (
          <button key={f.v} onClick={() => setFilter(f.v)} className="text-xs px-2 py-1 rounded-full border font-semibold" style={{ borderColor: COLORS.line, background: filter === f.v ? (color || COLORS.steel) : "#fff", color: filter === f.v ? "#fff" : COLORS.inkSoft }}>{f.l}</button>
        ))}
        <select value={sort} onChange={(e) => setSort(e.target.value)} className="text-xs px-2 py-1 rounded-full border font-semibold bg-white" style={{ borderColor: COLORS.line, color: COLORS.inkSoft }}>
          <option value="date">ترتيب: التاريخ</option>
          <option value="amountDesc">ترتيب: الأكبر للأصغر</option>
          <option value="amountAsc">ترتيب: الأصغر للأكبر</option>
        </select>
      </div>
    </div>
  );
}
function genCode() { return String(Math.floor(1000 + Math.random() * 9000)); }

function computeTotals(entries) {
  let debt = 0, lastPurchase = null, lastPayment = null;
  const sorted = [...(entries || [])].sort((a, b) => new Date(a.date) - new Date(b.date) || a.id - b.id);
  for (const e of sorted) {
    const amt = Number(e.amount) || 0;
    if (e.type === "purchase") { debt += amt; lastPurchase = e; }
    else if (e.type === "payment") { debt -= amt; lastPayment = e; }
    else if (e.type === "return") { debt -= amt; }
  }
  return { debt, lastPurchase, lastPayment };
}
function debtStatusColor(debt, ceiling) {
  if (debt <= 0) return "green";
  if (ceiling && Number(ceiling) > 0 && debt >= Number(ceiling)) return "red";
  return "yellow";
}
const STATUS_COLORS = { green: "#4C7A3B", yellow: "#FFC107", red: "#A8462C" };
const STATUS_SOFT = { green: "#E4E9D9", yellow: "#F3E9D2", red: "#F3DCD3" };
const STATUS_TEXT = { green: "#ffffff", yellow: "#161310", red: "#ffffff" };

function sumByPredicate(entries, pred) {
  let purchases = 0, payments = 0;
  for (const e of entries || []) {
    if (!pred(e)) continue;
    const amt = Number(e.amount) || 0;
    if (e.type === "purchase") purchases += amt;
    if (e.type === "payment") payments += amt;
  }
  return { purchases, payments };
}
function periodStats(entries) {
  const today = todayStr();
  const t7 = Date.now() - 7 * 86400000;
  const t30 = Date.now() - 30 * 86400000;
  return {
    today: sumByPredicate(entries, (e) => e.date === today),
    week: sumByPredicate(entries, (e) => new Date(e.date).getTime() >= t7),
    month: sumByPredicate(entries, (e) => new Date(e.date).getTime() >= t30),
  };
}

function toWaNumber(phone) {
  if (!phone) return null;
  let p = String(phone).replace(/[^\d+]/g, "");
  if (p.startsWith("+")) p = p.slice(1);
  if (p.startsWith("00")) p = p.slice(2);
  if (p.startsWith("0")) p = "964" + p.slice(1);
  else if (!p.startsWith("964")) p = "964" + p;
  return p;
}
function buildWaMessage({ customerName, type, desc, amount, date, debt }) {
  let opening;
  if (type === "purchase") opening = "تم تسجيل عملية شراء";
  else if (type === "payment") opening = "تم تسديد";
  else opening = "تم تسجيل ترجيع مواد";
  return (
    `مرحباً ${customerName}،\n${SHOP_NAME}\n\n` +
    `${opening} ${fmtMoney(amount)}${desc ? " (" + desc + ")" : ""} بتاريخ ${fmtDate(date)}.\n\n` +
    `إجمالي حسابك الحالي: ${fmtMoney(debt)}`
  );
}
function isShopOpenNow() {
  const h = new Date().getHours();
  return h >= OPEN_HOUR && h < CLOSE_HOUR;
}
function discountLabel(d) {
  if (!d) return "";
  return d.type === "percent" ? `${d.value}%` : fmtMoney(d.value);
}
function getActiveDiscount(settings, customerCode) {
  const d = settings?.discount;
  if (!d || !d.enabled) return null;
  if (d.scope === "selected" && !(d.selectedCodes || []).includes(customerCode)) return null;
  if (!d.endDate) return null;
  const end = new Date(d.endDate + "T23:59:59");
  if (Date.now() > end.getTime()) return null;
  return d;
}

/* ============ قفل بعد 3 محاولات خاطئة ============ */
async function checkLock(key) {
  try {
    const r = await storage.get(key);
    if (!r) return { locked: false, count: 0 };
    const d = JSON.parse(r.value);
    if (d.lockedUntil && Date.now() < d.lockedUntil) return { locked: true, count: d.count || 0 };
    return { locked: false, count: d.count || 0 };
  } catch { return { locked: false, count: 0 }; }
}
async function registerFail(key) {
  try {
    const cur = await checkLock(key);
    const count = (cur.count || 0) + 1;
    const locked = count >= 3;
    await storage.set(key, JSON.stringify({ count: locked ? 0 : count, lockedUntil: locked ? Date.now() + 60 * 60 * 1000 : null }));
    return { count, locked };
  } catch { return { count: 0, locked: false }; }
}
async function clearLock(key) {
  try { await storage.set(key, JSON.stringify({ count: 0, lockedUntil: null })); } catch {}
}

/* ============ إدخال مبالغ بفواصل الآلاف ============ */
function MoneyInput({ value, onChange, placeholder, className, style, autoFocus }) {
  const display = value === "" || value === null || value === undefined ? "" : Number(value).toLocaleString("en-US");
  return (
    <input
      autoFocus={autoFocus}
      value={display}
      onChange={(e) => {
        const raw = normalizeDigits(e.target.value).replace(/[^\d]/g, "");
        onChange(raw === "" ? "" : String(Number(raw)));
      }}
      inputMode="numeric"
      placeholder={placeholder}
      className={className}
      style={style}
    />
  );
}

/* ============ شاشة الدخول ============ */
function Landing({ onEnterCustomer, onEnterAdmin, settings }) {
  const T = ADMIN_THEMES[settings.theme] || ADMIN_THEMES.mustard;
  const [code, setCode] = useState("");
  const [showMenu, setShowMenu] = useState(false);
  const [showAdmin, setShowAdmin] = useState(false);
  const [pin, setPin] = useState("");
  const [err, setErr] = useState("");
  const [custErr, setCustErr] = useState("");
  const [busy, setBusy] = useState(false);

  const handleCustomerEnter = async () => {
    const c = normalizeDigits(code.trim());
    if (!c || busy) return;
    setBusy(true); setCustErr("");
    const lockKey = `lockout-c-${c}`;
    const lock = await checkLock(lockKey);
    if (lock.locked) { setCustErr("محاولات كثيرة خاطئة — الكود مقفل، حاول بعد ساعة"); setBusy(false); return; }
    try {
      const r = await storage.get(`customer-${c}`);
      if (r) { await clearLock(lockKey); setBusy(false); onEnterCustomer(c); return; }
    } catch {}
    const res = await registerFail(lockKey);
    setBusy(false);
    setCustErr(res.locked ? "محاولات كثيرة خاطئة — الكود مقفل لمدة ساعة" : `الكود غير صحيح (باقي ${3 - res.count} محاولة)`);
  };

  const handleAdminEnter = async () => {
    if (busy) return;
    setBusy(true); setErr("");
    const lockKey = "lockout-admin";
    const lock = await checkLock(lockKey);
    if (lock.locked) { setErr("محاولات كثيرة — مقفل لمدة ساعة"); setBusy(false); return; }
    const p = normalizeDigits(pin.trim());
    const correctPin = settings.adminPin || "9001";
    if (p === correctPin) { await clearLock(lockKey); setBusy(false); onEnterAdmin(); return; }
    const res = await registerFail(lockKey);
    setBusy(false);
    setErr(res.locked ? "محاولات كثيرة — مقفل لمدة ساعة" : `رمز غير صحيح (باقي ${3 - res.count} محاولة)`);
  };

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-5 relative overflow-hidden" style={{ background: `radial-gradient(circle at 30% 15%, ${T.bg}, ${T.bg2} 75%)`, color: T.text }}>
      <div className="absolute inset-0 pointer-events-none select-none">
        {TOOL_LAYOUT.map((t, i) => (
          <div key={i} className="absolute" style={{ top: t.top, left: t.left, color: T.text, opacity: 0.1, transform: `rotate(${t.rot}deg)` }}>
            <ToolIcon type={t.type} size={t.size} />
          </div>
        ))}
      </div>

      <button onClick={() => setShowMenu((s) => !s)} className="absolute top-4 left-4 z-20 w-9 h-9 rounded-full flex items-center justify-center text-lg font-bold" style={{ background: "rgba(0,0,0,0.08)", color: T.text }}>⋮</button>
      {showMenu && (
        <div className="absolute top-14 left-4 z-20 rounded-xl border p-2 text-sm" style={{ background: "#fff", borderColor: T.line, color: T.text }}>
          <button onClick={() => { setShowAdmin(true); setShowMenu(false); }} className="px-3 py-2 rounded-lg whitespace-nowrap font-semibold">دخول صاحب المحل</button>
        </div>
      )}

      <div className="w-full max-w-sm relative z-10">
        <div className="text-center mb-8">
          <div className="inline-block px-3 py-1 mb-4 text-xs font-bold" style={{ color: T.text, letterSpacing: "0.25em" }}>كشف حساب الزبائن</div>
          <h1 className="text-3xl font-extrabold leading-tight mb-2" style={{ fontFamily: "Cairo, sans-serif", color: T.text }}>{SHOP_NAME}</h1>
          <div className="text-xs leading-relaxed font-semibold" style={{ color: T.textSoft, letterSpacing: "0.05em" }}>
            <div>مواد إنشائية • أصباغ • أدوات بناء</div>
            <div className="mt-1">بغداد - العامرية - شارع العمل الشعبي - قرب جسر حي الجهاد</div>
          </div>
          <div className="mx-auto mt-4" style={{ width: 44, height: 2, background: T.text, opacity: 0.5 }} />
        </div>

        <div className="p-5 rounded-xl border" style={{ borderColor: T.line, background: T.panel }}>
          <label className="block text-sm mb-2 font-semibold" style={{ color: T.text }}>أدخل الكود الخاص بك لمعرفة حسابك</label>
          <div className="flex gap-2">
            <input value={code} onChange={(e) => setCode(normalizeDigits(e.target.value.trim()))} placeholder="مثال: 4821" inputMode="numeric" className="flex-1 px-3 py-3 rounded-lg border text-lg tracking-widest text-center outline-none" style={{ borderColor: T.text, background: "#F5ECDA", color: "#1C1712" }} onKeyDown={(e) => { if (e.key === "Enter") handleCustomerEnter(); }} />
            <button onClick={handleCustomerEnter} className="px-4 rounded-lg font-bold" style={{ background: T.accent, color: T.accentText }}>دخول</button>
          </div>
          {custErr && <div className="text-xs mt-2 font-bold" style={{ color: "#7A2418" }}>{custErr}</div>}
        </div>

        {showAdmin && (
          <div className="text-center mt-6">
            <div className="p-4 rounded-xl border mt-2" style={{ borderColor: T.line, background: "rgba(0,0,0,0.06)" }}>
              <label className="block text-sm mb-2 font-semibold" style={{ color: T.text }}>الرمز السري للإدارة</label>
              <div className="flex gap-2">
                <input type="password" value={pin} onChange={(e) => setPin(normalizeDigits(e.target.value))} className="flex-1 px-3 py-2 rounded-lg border text-center outline-none" style={{ borderColor: T.text, background: "#F5ECDA", color: "#1C1712" }} onKeyDown={(e) => { if (e.key === "Enter") handleAdminEnter(); }} />
                <button onClick={handleAdminEnter} className="px-4 rounded-lg font-bold" style={{ background: T.accent, color: T.accentText }}>دخول</button>
              </div>
              {err && <div className="text-xs mt-2 font-bold" style={{ color: "#7A2418" }}>{err}</div>}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

/* ============ واجهة الزبون ============ */
function CustomerView({ code, onBack, settings }) {
  const [data, setData] = useState(null);
  const [status, setStatus] = useState("loading");
  const [showHistory, setShowHistory] = useState(true);
  const [showContact, setShowContact] = useState(false);
  const [showPay, setShowPay] = useState(false);
  const [cardCopied, setCardCopied] = useState(false);
  const [histSearch, setHistSearch] = useState("");
  const [histFilter, setHistFilter] = useState("all");
  const [histSort, setHistSort] = useState("date");
  const [selectedSub, setSelectedSub] = useState(null);
  const loggedRef = useRef(false);

  const load = useCallback(async () => {
    try {
      const res = await storage.get(`customer-${code}`);
      if (!res) { setStatus("notfound"); return; }
      const parsed = JSON.parse(res.value);
      setData(parsed);
      setStatus("ok");
      storage.set(`lastseen-${code}`, JSON.stringify({ t: Date.now() })).catch(() => {});
      if (!loggedRef.current) {
        loggedRef.current = true;
        (async () => {
          try {
            const r = await storage.get("login-log");
            const log = r ? JSON.parse(r.value) : [];
            log.unshift({ code, name: parsed.name, t: Date.now() });
            await storage.set("login-log", JSON.stringify(log.slice(0, 200)));
          } catch {}
        })();
      }
    } catch {
      setStatus("notfound");
    }
  }, [code]);

  useEffect(() => {
    load();
    const t = setInterval(load, 20000);
    return () => clearInterval(t);
  }, [load]);

  if (status === "loading") return <CenteredMsg text="جاري التحميل..." />;
  if (status === "notfound") return <CenteredMsg text="الكود غير موجود، تأكد منه مع صاحب المحل" actionLabel="رجوع" onAction={onBack} />;

  const hasSubs = data.subAccounts && data.subAccounts.length > 0;

  if (hasSubs && !selectedSub) {
    const subRows = data.subAccounts.map((s) => {
      const { debt } = computeTotals(s.entries);
      return { ...s, debt, status: debtStatusColor(debt, s.ceiling) };
    });
    return (
      <div className="min-h-screen px-4 py-6" style={{ background: COLORS.paper, color: COLORS.ink }}>
        <div className="max-w-md mx-auto">
          <div className="flex items-center justify-between mb-5">
            <button onClick={onBack} className="text-sm" style={{ color: COLORS.inkSoft }}>← رجوع</button>
          </div>
          <div className="text-center mb-6">
            <div className="text-lg font-extrabold" style={{ fontFamily: "Cairo, sans-serif" }}>مرحباً {data.name} 👋</div>
            <div className="text-sm mt-1" style={{ color: COLORS.inkSoft }}>اختر الحساب اللي تريد تشوفه</div>
          </div>
          <div className="space-y-2">
            {subRows.map((s) => (
              <button key={s.id} onClick={() => setSelectedSub(s.id)} className="w-full text-right p-4 rounded-xl border bg-white flex items-center justify-between hover:opacity-90" style={{ borderColor: COLORS.line, borderRightWidth: 5, borderRightColor: STATUS_COLORS[s.status] }}>
                <div className="font-bold">{s.name}</div>
                <div className="font-extrabold" style={{ color: STATUS_COLORS[s.status] }}>{fmtMoney(s.debt)}</div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  const sub = hasSubs ? data.subAccounts.find((s) => s.id === selectedSub) : null;
  const viewData = sub ? { name: `${data.name} — ${sub.name}`, ceiling: sub.ceiling, entries: sub.entries } : data;
  const backAction = hasSubs ? () => setSelectedSub(null) : onBack;

  const { debt, lastPurchase, lastPayment } = computeTotals(viewData.entries);
  const baseHistory = [...(viewData.entries || [])].sort((a, b) => entrySortKey(b) - entrySortKey(a));
  const history = applyHistoryControls(baseHistory, { search: histSearch, filter: histFilter, sort: histSort });
  const numberMap = numberMapFor(viewData.entries);
  const status_ = debtStatusColor(debt, viewData.ceiling);
  const discount = getActiveDiscount(settings, code);

  const copyCard = () => {
    try { navigator.clipboard.writeText(CARD_NUMBER); setCardCopied(true); setTimeout(() => setCardCopied(false), 1500); } catch {}
  };

  return (
    <div className="min-h-screen px-4 py-6" style={{ background: COLORS.paper, color: COLORS.ink }}>
      <div className="max-w-md mx-auto">
        <div className="flex items-center justify-between mb-3">
          <button onClick={backAction} className="text-sm" style={{ color: COLORS.inkSoft }}>{hasSubs ? "← حساباتي" : "← رجوع"}</button>
          <div className="flex items-center gap-3">
            <button onClick={load} className="text-sm" style={{ color: COLORS.steel }}>تحديث</button>
            <button onClick={() => setShowContact(true)} className="w-8 h-8 rounded-full flex items-center justify-center text-sm" style={{ background: COLORS.steelSoft, color: COLORS.steel }}>☰</button>
          </div>
        </div>

        <div className="text-center mb-5">
          <div className="text-lg font-extrabold" style={{ fontFamily: "Cairo, sans-serif" }}>مرحباً {viewData.name} 👋</div>
        </div>

        {discount && (
          <div className="rounded-lg p-3 mb-4 text-center text-sm font-bold" style={{ background: STATUS_SOFT.red, color: STATUS_COLORS.red }}>
            🎉 عرض تسديد سريع: سدد {fmtMoney(discount.minPayment)} أو أكثر قبل {fmtDate(discount.endDate)} واحصل على خصم {discountLabel(discount)}
            {discount.note && <div className="mt-1 font-normal">{discount.note}</div>}
          </div>
        )}

        <div className="rounded-2xl p-6 text-center mb-4" style={{ background: STATUS_COLORS[status_], color: STATUS_TEXT[status_] }}>
          <div className="text-sm mb-2" style={{ opacity: 0.85 }}>المبلغ المستحق عليك</div>
          <div className="text-4xl font-extrabold" style={{ fontFamily: "Cairo, sans-serif" }}>{fmtMoney(debt)}</div>
          {debt > 0 && (
            <button onClick={() => setShowPay(true)} className="mt-4 px-5 py-2 rounded-lg font-bold text-sm" style={{ background: STATUS_TEXT[status_], color: STATUS_COLORS[status_] }}>💳 دفع إلكتروني</button>
          )}
        </div>

        <div className="grid grid-cols-1 gap-3 mb-4">
          <div className="rounded-xl p-4 border" style={{ background: COLORS.brickSoft, borderColor: COLORS.line }}>
            <div className="text-xs font-bold mb-2" style={{ color: COLORS.brick }}>آخر عملية شراء</div>
            {lastPurchase ? (
              <div className="text-sm"><div className="font-semibold">{lastPurchase.desc || "بدون وصف"}</div><div style={{ color: COLORS.inkSoft }}>{fmtMoney(lastPurchase.amount)} — {fmtDate(lastPurchase.date)}</div></div>
            ) : (<div className="text-sm" style={{ color: COLORS.inkSoft }}>لا توجد عمليات شراء بعد</div>)}
          </div>
          <div className="rounded-xl p-4 border" style={{ background: COLORS.oliveSoft, borderColor: COLORS.line }}>
            <div className="text-xs font-bold mb-2" style={{ color: COLORS.olive }}>آخر تسديد</div>
            {lastPayment ? (
              <div className="text-sm"><div className="font-semibold">{fmtMoney(lastPayment.amount)}</div><div style={{ color: COLORS.inkSoft }}>{fmtDate(lastPayment.date)}</div></div>
            ) : (<div className="text-sm" style={{ color: COLORS.inkSoft }}>لا يوجد تسديد بعد</div>)}
          </div>
        </div>

        <div className="grid grid-cols-2 gap-2 mb-3">
          <button onClick={() => setShowHistory((s) => !s)} className="text-sm py-2 rounded-lg border" style={{ borderColor: COLORS.line, color: COLORS.inkSoft }}>{showHistory ? "إخفاء السجل ▲" : "سجل العمليات ▼"}</button>
          <button onClick={() => setShowPay((s) => !s)} className="text-sm py-2 rounded-lg border font-semibold" style={{ borderColor: COLORS.steel, color: COLORS.steel }}>💳 دفع إلكتروني</button>
        </div>

        {showPay && (
          <div className="mb-3 p-4 rounded-xl border bg-white text-sm text-center" style={{ borderColor: COLORS.line }}>
            <div className="mb-1" style={{ color: COLORS.inkSoft }}>حوّل المبلغ على حساب الماستر كارد:</div>
            <div className="font-bold text-lg" style={{ letterSpacing: "1px" }}>{CARD_NUMBER}</div>
            <div style={{ color: COLORS.inkSoft }}>باسم: {CARD_NAME}</div>
            <button onClick={copyCard} className="text-xs px-3 py-1 rounded border mt-2" style={{ borderColor: COLORS.line }}>{cardCopied ? "تم النسخ ✓" : "نسخ الرقم"}</button>
            <div className="text-xs mt-3 font-bold" style={{ color: COLORS.brick }}>⚠️ لازم ترسل صورة وصل التحويل عبر واتساب لرقم المحل بعد الدفع</div>
            <button onClick={() => window.open(`https://wa.me/${toWaNumber(SHOP_PHONE)}?text=${encodeURIComponent("مرفق وصل تحويل من " + viewData.name)}`, "_blank")} className="w-full mt-2 py-2 rounded-lg font-bold text-white text-sm" style={{ background: COLORS.waGreen }}>إرسال الوصل عبر واتساب</button>
          </div>
        )}

        {showHistory && (
          <div>
            <HistoryControls search={histSearch} setSearch={setHistSearch} filter={histFilter} setFilter={setHistFilter} sort={histSort} setSort={setHistSort} color={COLORS.steel} />
            <div className="space-y-2">
              {history.length === 0 && <div className="text-sm text-center" style={{ color: COLORS.inkSoft }}>لا توجد عمليات</div>}
              {history.map((e) => (
                <div key={e.id} className="flex items-center justify-between p-3 rounded-lg border bg-white" style={{ borderColor: COLORS.line }}>
                  <div>
                    <div className="text-sm font-semibold">#{numberMap[e.id]} — {e.type === "purchase" ? "شراء" : e.type === "payment" ? "تسديد" : "ترجيع"}{e.desc ? ` — ${e.desc}` : ""}</div>
                    <div className="text-xs" style={{ color: COLORS.inkSoft }}>{fmtDate(e.date)}</div>
                  </div>
                  <div className="font-bold" style={{ color: e.type === "purchase" ? COLORS.brick : COLORS.olive }}>{e.type === "purchase" ? "+" : "-"}{fmtMoney(e.amount)}</div>
                </div>
              ))}
            </div>
          </div>
        )}
      </div>
      <ContactPanel open={showContact} onClose={() => setShowContact(false)} customerName={viewData.name} />
    </div>
  );
}

        <div className="text-sm font-semibold mb-1">نطاق العرض</div>
        <div className="flex gap-2 mb-3">
          <button onClick={() => setD({ ...d, scope: "all" })} className="flex-1 py-2 rounded-lg border text-sm font-bold" style={{ borderColor: T.line, background: d.scope === "all" ? T.panel : "#fff" }}>كل الزبائن</button>
          <button onClick={() => setD({ ...d, scope: "selected" })} className="flex-1 py-2 rounded-lg border text-sm font-bold" style={{ borderColor: T.line, background: d.scope === "selected" ? T.panel : "#fff" }}>زبائن محددين</button>
        </div>

        {d.scope === "selected" && (
          <div className="mb-3 max-h-48 overflow-auto border rounded-lg p-2" style={{ borderColor: T.line }}>
            {(allCustomers || []).map((c) => (
              <label key={c.code} className="flex items-center gap-2 py-1 text-sm">
                <input type="checkbox" checked={(d.selectedCodes || []).includes(c.code)} onChange={() => toggleSelected(c.code)} /> {c.name}
              </label>
            ))}
            {(!allCustomers || allCustomers.length === 0) && <div className="text-xs" style={{ color: T.textSoft }}>لا يوجد زبائن</div>}
          </div>
        )}

        <button onClick={() => onSave(d)} className="w-full py-2 rounded-lg font-bold" style={{ background: T.accent, color: T.accentText }}>حفظ الإعدادات</button>
      </div>
    </ScreenShell>
  );
}

/* ============ بطاقة إحصائية (يوم / أسبوع / شهر + مدة مخصصة + تصفير) ============ */
function StatsCard({ T, entries, resetAt, onReset }) {
  const [showCustom, setShowCustom] = useState(false);
  const [from, setFrom] = useState("");
  const [to, setTo] = useState("");
  const resetDateStr = resetAt ? new Date(resetAt).toISOString().slice(0, 10) : null;
  const filtered = resetDateStr ? (entries || []).filter((e) => e.date >= resetDateStr) : entries;
  const s = periodStats(filtered);
  const rows = [{ label: "اليوم", v: s.today }, { label: "آخر 7 أيام", v: s.week }, { label: "آخر 30 يوم", v: s.month }];
  const customStats = showCustom && from && to ? sumByPredicate(entries, (e) => e.date >= from && e.date <= to) : null;

  return (
    <div className="rounded-xl p-3 mb-4 border bg-white" style={{ borderColor: T.line }}>
      <div className="grid grid-cols-3 gap-2 mb-2">
        {rows.map((r) => (
          <div key={r.label} className="text-center">
            <div className="text-xs font-bold mb-1" style={{ color: T.textSoft }}>{r.label}</div>
            <div className="text-xs" style={{ color: COLORS.brick }}>شراء {fmtMoney(r.v.purchases)}</div>
            <div className="text-xs" style={{ color: COLORS.olive }}>تسديد {fmtMoney(r.v.payments)}</div>
          </div>
        ))}
      </div>
      <div className="flex justify-between items-center text-xs pt-2 border-t" style={{ borderColor: T.line }}>
        <button onClick={() => setShowCustom((s2) => !s2)} className="font-semibold" style={{ color: T.text }}>مدة مخصصة {showCustom ? "▲" : "▼"}</button>
        {onReset && <button onClick={onReset} className="font-semibold" style={{ color: COLORS.brick }}>تصفير الإحصائيات ↺</button>}
      </div>
      {showCustom && (
        <div className="mt-2 flex gap-2 items-center">
          <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} className="flex-1 px-2 py-1 rounded border text-xs outline-none" style={{ borderColor: T.line }} />
          <span className="text-xs">إلى</span>
          <input type="date" value={to} onChange={(e) => setTo(e.target.value)} className="flex-1 px-2 py-1 rounded border text-xs outline-none" style={{ borderColor: T.line }} />
        </div>
      )}
      {customStats && (
        <div className="mt-2 text-center text-xs flex justify-center gap-4">
          <div style={{ color: COLORS.brick }}>شراء {fmtMoney(customStats.purchases)}</div>
          <div style={{ color: COLORS.olive }}>تسديد {fmtMoney(customStats.payments)}</div>
        </div>
      )}
    </div>
  );
}

/* ============ لوحة الإدارة ============ */
function AdminView({ onBack, settings, onSaveSettings }) {
  const T = ADMIN_THEMES[settings.theme] || ADMIN_THEMES.mustard;
  const [index, setIndex] = useState(null);
  const [loading, setLoading] = useState(true);
  const [customers, setCustomers] = useState({});
  const [openCode, setOpenCode] = useState(null);
  const [addingCustomer, setAddingCustomer] = useState(false);
  const [newName, setNewName] = useState("");
  const [newPhone, setNewPhone] = useState("");
  const [toast, setToast] = useState("");
  const [search, setSearch] = useState("");
  const [menuOpen, setMenuOpen] = useState(false);
  const [screen, setScreen] = useState("dashboard");
  const [loginLog, setLoginLog] = useState([]);

  const loadAll = useCallback(async () => {
    setLoading(true);
    try {
      const idxRes = await storage.get("customer-index");
      const idx = idxRes ? JSON.parse(idxRes.value) : [];
      setIndex(idx);
      const map = {};
      for (const c of idx) {
        try { const r = await storage.get(`customer-${c.code}`); if (r) map[c.code] = JSON.parse(r.value); } catch {}
      }
      setCustomers(map);
      try { const lr = await storage.get("login-log"); setLoginLog(lr ? JSON.parse(lr.value) : []); } catch {}
    } catch { setIndex([]); }
    setLoading(false);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  const flashToast = (t) => { setToast(t); setTimeout(() => setToast(""), 1800); };

  const setWithRetry = async (key, value) => {
    try { await storage.set(key, value); }
    catch { await new Promise((r) => setTimeout(r, 600)); await storage.set(key, value); }
  };

  const addCustomer = async () => {
    if (!newName.trim()) return;
    let code = genCode();
    const existingCodes = new Set((index || []).map((c) => c.code));
    while (existingCodes.has(code)) code = genCode();
    const newIndex = [...(index || []), { code, name: newName.trim() }];
    const newCustomer = { name: newName.trim(), phone: newPhone.trim(), entries: [] };
    try {
      await setWithRetry("customer-index", JSON.stringify(newIndex));
      await setWithRetry(`customer-${code}`, JSON.stringify(newCustomer));
      setIndex(newIndex);
      setCustomers((m) => ({ ...m, [code]: newCustomer }));
      setNewName(""); setNewPhone(""); setAddingCustomer(false);
      flashToast(`تمت إضافة الزبون — الكود: ${code}`);
    } catch (e) { flashToast("خطأ: " + (e?.message || "غير معروف")); }
  };

  const saveCustomer = async (code, updated) => {
    try { await setWithRetry(`customer-${code}`, JSON.stringify(updated)); setCustomers((m) => ({ ...m, [code]: updated })); }
    catch (e) { flashToast("خطأ بالحفظ: " + (e?.message || "غير معروف")); }
  };

  const changeCode = async (oldCode, newCodeRaw) => {
    const newCode = normalizeDigits(String(newCodeRaw || "").trim());
    if (!newCode || newCode === oldCode) return;
    if ((index || []).some((c) => c.code === newCode)) { flashToast("الكود مستخدم لزبون ثاني"); return; }
    const cdata = customers[oldCode];
    try {
      await setWithRetry(`customer-${newCode}`, JSON.stringify(cdata));
      const newIndex = (index || []).map((c) => (c.code === oldCode ? { ...c, code: newCode } : c));
      await setWithRetry("customer-index", JSON.stringify(newIndex));
      try { await storage.delete(`customer-${oldCode}`); } catch {}
      setIndex(newIndex);
      setCustomers((m) => { const n = { ...m }; delete n[oldCode]; n[newCode] = cdata; return n; });
      flashToast("تم تغيير الكود بنجاح");
    } catch (e) { flashToast("خطأ: " + (e?.message || "")); }
  };

  const deleteCustomer = async (code) => {
    if (!window.confirm("متأكد تريد حذف حساب هذا الزبون نهائياً؟ هذا الإجراء لا يمكن التراجع عنه")) return;
    try {
      const newIndex = (index || []).filter((c) => c.code !== code);
      await setWithRetry("customer-index", JSON.stringify(newIndex));
      try { await storage.delete(`customer-${code}`); } catch {}
      setIndex(newIndex);
      setCustomers((m) => { const n = { ...m }; delete n[code]; return n; });
      setOpenCode(null);
      flashToast("تم حذف الزبون");
    } catch (e) { flashToast("خطأ: " + (e?.message || "")); }
  };

  const convertToMulti = async (code) => {
    if (!window.confirm("سيتم تحويل هذا الزبون لحسابات متعددة، وعملياته الحالية تنتقل لأول حساب فرعي. متابعة؟")) return;
    const cdata = customers[code];
    const firstSub = { id: "sub_" + Date.now(), name: "الحساب الأول", ceiling: cdata.ceiling || "", statsResetAt: cdata.statsResetAt || null, entries: cdata.entries || [] };
    const updated = { name: cdata.name, phone: cdata.phone, entries: [], ceiling: "", statsResetAt: null, subAccounts: [firstSub] };
    await saveCustomer(code, updated);
    flashToast("تم التقسيم لحسابات متعددة");
  };

  const saveAdminPin = async (newPin) => { const updated = { ...settings, adminPin: newPin }; await onSaveSettings(updated); flashToast("تم تغيير رمز الإدارة"); };
  const saveTheme = async (themeKey) => { const updated = { ...settings, theme: themeKey }; await onSaveSettings(updated); flashToast("تم تغيير الثيم"); setScreen("dashboard"); };
  const saveDiscount = async (d) => { const updated = { ...settings, discount: d }; await onSaveSettings(updated); flashToast("تم حفظ إعدادات الخصم"); setScreen("dashboard"); };
  const resetGlobalStats = async () => {
    if (!window.confirm("متأكد تريد تصفير إحصائيات كل المحل؟ (سجل العمليات يضل محفوظ بالكامل)")) return;
    const updated = { ...settings, statsResetAt: Date.now() };
    await onSaveSettings(updated);
    flashToast("تم تصفير الإحصائيات");
  };

  if (loading) return <CenteredMsg text="جاري تحميل بيانات الزبائن..." />;

  const rows = (index || []).map((c) => {
    const data = customers[c.code] || { entries: [] };
    const isFolder = data.subAccounts && data.subAccounts.length > 0;
    const allSubEntries = isFolder ? data.subAccounts.flatMap((s) => s.entries || []) : data.entries || [];
    const { debt, lastPurchase, lastPayment } = computeTotals(allSubEntries);
    const worstCeiling = isFolder ? null : data.ceiling;
    return { code: c.code, name: data.name || c.name, debt, lastPurchase, lastPayment, ceiling: worstCeiling, status: debtStatusColor(debt, worstCeiling), isFolder, subCount: isFolder ? data.subAccounts.length : 0 };
  });
  rows.sort((a, b) => b.debt - a.debt);
  const totalDebt = rows.reduce((s, r) => s + r.debt, 0);
  const allEntries = Object.values(customers).flatMap((c) => (c.subAccounts && c.subAccounts.length > 0 ? c.subAccounts.flatMap((s) => s.entries || []) : c.entries || []));
  const recentAll = Object.entries(customers)
    .flatMap(([code, c]) => (c.subAccounts && c.subAccounts.length > 0 ? c.subAccounts.flatMap((s) => (s.entries || []).map((e) => ({ ...e, customerName: `${c.name} — ${s.name}`, code }))) : (c.entries || []).map((e) => ({ ...e, customerName: c.name, code }))))
    .sort((a, b) => entrySortKey(b) - entrySortKey(a))
    .slice(0, 50);

  const q = normalizeDigits(search.trim().toLowerCase());
  const filteredRows = q ? rows.filter((r) => r.name.toLowerCase().includes(q) || r.code.includes(q)) : rows;

  if (openCode) {
    const cdata = customers[openCode] || { name: "", phone: "", entries: [] };
    if (cdata.subAccounts && cdata.subAccounts.length > 0) {
      return (
        <CustomerFolder
          T={T}
          code={openCode}
          data={cdata}
          onBack={() => setOpenCode(null)}
          onSave={(updated) => saveCustomer(openCode, updated)}
        />
      );
    }
    return (
      <CustomerDetail
        T={T}
        code={openCode}
        data={cdata}
        onBack={() => setOpenCode(null)}
        onSave={(updated) => saveCustomer(openCode, updated)}
        onDelete={() => deleteCustomer(openCode)}
        onConvertMulti={() => convertToMulti(openCode)}
      />
    );
  }
  if (screen === "codes") return <CodesScreen T={T} index={index} onBack={() => setScreen("dashboard")} onChangeCode={changeCode} />;
  if (screen === "pin") return <PinScreen T={T} onBack={() => setScreen("dashboard")} onSavePin={saveAdminPin} />;
  if (screen === "theme") return <ThemeScreen T={T} currentTheme={settings.theme} onBack={() => setScreen("dashboard")} onSaveTheme={saveTheme} />;
  if (screen === "discount") return <DiscountScreen T={T} discount={settings.discount} onBack={() => setScreen("dashboard")} onSave={saveDiscount} allCustomers={index} />;

  return (
    <div className="min-h-screen px-4 py-6" style={{ background: T.bg, color: T.text }}>
      <div className="max-w-2xl mx-auto">
        <div className="flex items-center justify-between mb-4">
          <button onClick={onBack} className="text-sm font-semibold" style={{ color: T.text }}>← خروج</button>
          <div className="text-xl font-extrabold" style={{ fontFamily: "Cairo, sans-serif" }}>لوحة الإدارة</div>
          <div className="flex items-center gap-3">
            <button onClick={loadAll} className="text-sm font-semibold" style={{ color: T.text }}>تحديث</button>
            <button onClick={() => setMenuOpen(true)} className="text-xl leading-none" style={{ color: T.text }}>☰</button>
          </div>
        </div>

        <div className="rounded-xl p-4 mb-4 flex items-center justify-between border" style={{ background: "#fff", borderColor: T.line }}>
          <div className="text-sm font-semibold" style={{ color: T.text }}>إجمالي الديون على كل الزبائن</div>
          <div className="text-xl font-extrabold" style={{ color: T.text }}>{fmtMoney(totalDebt)}</div>
        </div>

        <StatsCard T={T} entries={allEntries} resetAt={settings.statsResetAt} onReset={resetGlobalStats} />

        {(recentAll.length > 0 || loginLog.length > 0) && (
          <div className="grid grid-cols-2 gap-2 mb-4">
            {recentAll.length > 0 && (
              <div className="rounded-xl p-3 border bg-white" style={{ borderColor: T.line }}>
                <div className="text-xs font-bold mb-2" style={{ color: T.textSoft }}>📋 آخر العمليات</div>
                <div className="space-y-1 overflow-y-auto" style={{ maxHeight: 220 }}>
                  {recentAll.map((e, i) => (
                    <div key={i} className="text-xs py-1 border-b last:border-b-0" style={{ borderColor: T.line }}>
                      <div className="font-semibold">{e.customerName}</div>
                      <div className="flex justify-between">
                        <span style={{ color: T.textSoft }}>{e.type === "purchase" ? "شراء" : e.type === "payment" ? "تسديد" : "ترجيع"}</span>
                        <span className="font-bold" style={{ color: e.type === "purchase" ? COLORS.brick : COLORS.olive }}>{fmtMoney(e.amount)}</span>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
            {loginLog.length > 0 && (
              <div className="rounded-xl p-3 border bg-white" style={{ borderColor: T.line }}>
                <div className="text-xs font-bold mb-2" style={{ color: T.textSoft }}>👤 تسجيلات الدخول</div>
                <div className="space-y-1 overflow-y-auto" style={{ maxHeight: 220 }}>
                  {loginLog.map((l, i) => (
                    <div key={i} className="text-xs py-1 border-b last:border-b-0" style={{ borderColor: T.line }}>
                      <div className="font-semibold">{l.name}</div>
                      <div style={{ color: T.textSoft }}>{fmtDateTime(l.t)}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>
        )}

        {!addingCustomer ? (
          <button onClick={() => setAddingCustomer(true)} className="w-full mb-4 py-3 rounded-xl font-bold" style={{ background: T.accent, color: T.accentText }}>+ إضافة زبون جديد</button>
        ) : (
          <div className="mb-4 p-4 rounded-xl border bg-white" style={{ borderColor: T.line }}>
            <input autoFocus value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="اسم الزبون" className="w-full mb-2 px-3 py-2 rounded-lg border outline-none" style={{ borderColor: T.line }} />
            <input value={newPhone} onChange={(e) => setNewPhone(e.target.value)} placeholder="رقم واتساب الزبون (مثال: 07701234567)" inputMode="tel" className="w-full mb-3 px-3 py-2 rounded-lg border outline-none" style={{ borderColor: T.line }} onKeyDown={(e) => e.key === "Enter" && addCustomer()} />
            <div className="flex gap-2">
              <button onClick={addCustomer} className="flex-1 py-2 rounded-lg font-bold" style={{ background: T.accent, color: T.accentText }}>حفظ</button>
              <button onClick={() => { setAddingCustomer(false); setNewName(""); setNewPhone(""); }} className="px-4 rounded-lg border" style={{ borderColor: T.line }}>إلغاء</button>
            </div>
          </div>
        )}

        {rows.length > 0 && <input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="ابحث بالاسم أو الكود..." className="w-full mb-3 px-3 py-2 rounded-lg border outline-none bg-white" style={{ borderColor: T.line }} />}

        <div className="space-y-2">
          {rows.length === 0 && <div className="text-center text-sm py-8" style={{ color: T.textSoft }}>لا يوجد زبائن بعد. أضف أول زبون من الأعلى.</div>}
          {rows.length > 0 && filteredRows.length === 0 && <div className="text-center text-sm py-8" style={{ color: T.textSoft }}>ما في نتائج مطابقة</div>}
          {filteredRows.map((r) => (
            <button key={r.code} onClick={() => setOpenCode(r.code)} className="w-full text-right p-4 rounded-xl border bg-white flex items-center justify-between hover:opacity-90" style={{ borderColor: T.line, borderRightWidth: 5, borderRightColor: STATUS_COLORS[r.status] }}>
              <div>
                <div className="font-bold" style={{ color: COLORS.ink }}>{r.isFolder ? `📁 ${r.name} (${r.subCount} حسابات)` : r.name}</div>
                <div className="text-xs" style={{ color: COLORS.inkSoft }}>كود: {r.code}{r.lastPurchase ? ` • آخر شراء ${fmtDate(r.lastPurchase.date)}` : ""}{r.lastPayment ? ` • آخر تسديد ${fmtDate(r.lastPayment.date)}` : ""}</div>
              </div>
              <div className="font-extrabold" style={{ color: STATUS_COLORS[r.status] }}>{fmtMoney(r.debt)}</div>
            </button>
          ))}
        </div>
      </div>

      <AdminMenu open={menuOpen} onClose={() => setMenuOpen(false)} onNav={(k) => setScreen(k)} />

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-white text-sm" style={{ background: COLORS.ink }}>{toast}</div>}
    </div>
  );
}

/* ============ قائمة جانبية خاصة بزبون واحد (هاتف/سقف/آخر دخول/حذف) ============ */
function CustomerSidePanel({ open, onClose, phone, setPhone, ceiling, setCeiling, onSavePhone, onSaveCeiling, phoneSaved, ceilingSaved, lastSeen, onDelete, onConvertMulti }) {
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-50 flex justify-end" style={{ background: "rgba(0,0,0,0.4)" }} onClick={onClose}>
      <div onClick={(e) => e.stopPropagation()} className="w-72 h-full bg-white p-4 overflow-auto" style={{ color: COLORS.ink }}>
        <div className="flex justify-between items-center mb-4"><div className="font-bold">إعدادات الزبون</div><button onClick={onClose} className="text-sm" style={{ color: COLORS.inkSoft }}>✕</button></div>

        <label className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkSoft }}>رقم واتساب الزبون</label>
        <div className="flex gap-2 mb-4">
          <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="07701234567" inputMode="tel" className="flex-1 px-3 py-2 rounded-lg border text-sm outline-none" style={{ borderColor: COLORS.line }} />
          <button onClick={onSavePhone} className="px-3 rounded-lg border text-sm font-semibold bg-white" style={{ borderColor: COLORS.line }}>{phoneSaved ? "تم ✓" : "حفظ"}</button>
        </div>

        <label className="block text-xs font-semibold mb-1" style={{ color: COLORS.inkSoft }}>سقف الدين المسموح (اختياري)</label>
        <div className="flex gap-2 mb-4">
          <MoneyInput value={ceiling} onChange={setCeiling} placeholder="اختياري" className="flex-1 px-3 py-2 rounded-lg border text-sm outline-none" style={{ borderColor: COLORS.line }} />
          <button onClick={onSaveCeiling} className="px-3 rounded-lg border text-sm font-semibold bg-white" style={{ borderColor: COLORS.line }}>{ceilingSaved ? "تم ✓" : "حفظ"}</button>
        </div>

        <div className="text-xs mb-6" style={{ color: COLORS.inkSoft }}>
          آخر دخول للزبون: {lastSeen ? fmtDateTime(lastSeen) : "لم يسجل دخول بعد"}
        </div>

        {onConvertMulti && (
          <button onClick={onConvertMulti} className="w-full py-2 rounded-lg font-bold text-sm mb-3 border" style={{ borderColor: COLORS.steel, color: COLORS.steel }}>
            🗂️ تقسيم الزبون لعدة حسابات
          </button>
        )}

        <button onClick={onDelete} className="w-full py-2 rounded-lg font-bold text-white text-sm" style={{ background: COLORS.brick }}>حذف حساب الزبون نهائياً</button>
      </div>
    </div>
  );
}

/* ============ تفاصيل زبون واحد (للإدارة) ============ */
function CustomerDetail({ T, code, data, onBack, onSave, onDelete, onConvertMulti }) {
  const [entries, setEntries] = useState(data?.entries || []);
  const [name] = useState(data?.name || "");
  const [phone, setPhone] = useState(data?.phone || "");
  const [ceiling, setCeiling] = useState(data?.ceiling || "");
  const [statsResetAt, setStatsResetAt] = useState(data?.statsResetAt || null);
  const [phoneSaved, setPhoneSaved] = useState(false);
  const [ceilingSaved, setCeilingSaved] = useState(false);
  const [showSidePanel, setShowSidePanel] = useState(false);
  const [lastSeen, setLastSeen] = useState(null);

  const [editingId, setEditingId] = useState(null);
  const [type, setType] = useState("purchase");
  const [desc, setDesc] = useState(DEFAULT_DESC);
  const [amount, setAmount] = useState("");
  const [date, setDate] = useState(todayStr());
  const [copied, setCopied] = useState(false);
  const [histSearch, setHistSearch] = useState("");
  const [histFilter, setHistFilter] = useState("all");
  const [histSort, setHistSort] = useState("date");

  useEffect(() => {
    (async () => {
      try { const r = await storage.get(`lastseen-${code}`); if (r) setLastSeen(JSON.parse(r.value).t); } catch {}
    })();
  }, [code]);

  const { debt, lastPurchase, lastPayment } = computeTotals(entries);
  const baseHistory = [...entries].sort((a, b) => entrySortKey(b) - entrySortKey(a));
  const history = applyHistoryControls(baseHistory, { search: histSearch, filter: histFilter, sort: histSort });
  const numberMap = numberMapFor(entries);
  const status_ = debtStatusColor(debt, ceiling);

  const persist = (patch) => onSave({ name, phone, ceiling, statsResetAt, entries, ...patch });

  const savePhone = () => { persist({ phone }); setPhoneSaved(true); setTimeout(() => setPhoneSaved(false), 1500); };
  const saveCeiling = () => { persist({ ceiling }); setCeilingSaved(true); setTimeout(() => setCeilingSaved(false), 1500); };
  const resetStats = () => {
    if (!window.confirm("متأكد تريد تصفير إحصائيات هذا الزبون؟ (سجل العمليات يضل محفوظ بالكامل)")) return;
    const t = Date.now();
    setStatsResetAt(t);
    persist({ statsResetAt: t });
  };

  const sendWaForEntry = (e) => {
    if (!phone || !phone.trim()) return;
    const { debt: currentDebt } = computeTotals(entries);
    const msg = buildWaMessage({ customerName: name, type: e.type, desc: e.desc, amount: e.amount, date: e.date, debt: currentDebt });
    window.open(`https://wa.me/${toWaNumber(phone)}?text=${encodeURIComponent(msg)}`, "_blank");
  };

  const sendReminder = () => {
    if (!phone || !phone.trim()) return;
    const msg = `مرحباً ${name}، محلات بيت الإنشائية تذكركم بأن رصيدكم الحالي هو ${fmtMoney(debt)}، نتشرف بزيارتكم أو الاتفاق على موعد للتسوية، طبتم وطابت اوقاتكم بالخير والبركات`;
    window.open(`https://wa.me/${toWaNumber(phone)}?text=${encodeURIComponent(msg)}`, "_blank");
  };

  const resetForm = () => { setEditingId(null); setType("purchase"); setDesc(DEFAULT_DESC); setAmount(""); setDate(todayStr()); };

  const startEdit = (e) => { setEditingId(e.id); setType(e.type); setDesc(e.desc || ""); setAmount(String(e.amount)); setDate(e.date); };

  const saveEntry = () => {
    if (!amount || Number(amount) <= 0) return;
    let newEntries;
    if (editingId) {
      newEntries = entries.map((e) => {
        if (e.id !== editingId) return e;
        let newDesc = desc.trim();
        if (!newDesc.includes("(قائمة معدلة)")) newDesc = (newDesc ? newDesc + " " : "") + "(قائمة معدلة)";
        return { ...e, type, desc: newDesc, amount: Number(amount), date, editedAt: Date.now() };
      });
    } else {
      const e = { id: Date.now(), type, desc: desc.trim(), amount: Number(amount), date };
      newEntries = [...entries, e];
    }
    setEntries(newEntries);
    persist({ entries: newEntries });
    resetForm();
  };

  const deleteEntry = (id) => {
    if (!window.confirm("متأكد تريد حذف هذه العملية؟")) return;
    const newEntries = entries.filter((e) => e.id !== id);
    setEntries(newEntries);
    persist({ entries: newEntries });
  };

  const copyCode = () => { try { navigator.clipboard.writeText(code); setCopied(true); setTimeout(() => setCopied(false), 1500); } catch {} };

  return (
    <div className="min-h-screen px-4 py-6" style={{ background: T.bg, color: T.text }}>
      <div className="max-w-md mx-auto">
        <div className="flex justify-between items-center mb-4">
          <button onClick={onBack} className="text-sm font-semibold" style={{ color: T.text }}>← رجوع لكل الزبائن</button>
          <button onClick={() => setShowSidePanel(true)} className="text-xl leading-none" style={{ color: T.text }}>☰</button>
        </div>

        <div className="mb-4">
          <div className="text-xl font-extrabold" style={{ fontFamily: "Cairo, sans-serif" }}>{name}</div>
          <button onClick={copyCode} className="text-xs mt-1 px-2 py-1 rounded border inline-block bg-white" style={{ borderColor: T.line, color: T.text }}>{copied ? "تم نسخ الكود ✓" : `كود الزبون: ${code} (اضغط للنسخ)`}</button>
        </div>

        <div className="rounded-xl p-4 text-center mb-4" style={{ background: STATUS_COLORS[status_], color: STATUS_TEXT[status_] }}>
          <div className="text-xs mb-1" style={{ opacity: 0.85 }}>المجموع المطلوب من الزبون</div>
          <div className="text-3xl font-extrabold mb-2">{fmtMoney(debt)}</div>
          {phone && phone.trim() && debt > 0 && (
            <button onClick={sendReminder} className="text-xs px-3 py-2 rounded-lg font-bold" style={{ background: STATUS_TEXT[status_], color: STATUS_COLORS[status_] }}>🔔 تذكير بالدين عبر واتساب</button>
          )}
        </div>

        <StatsCard T={T} entries={entries} resetAt={statsResetAt} onReset={resetStats} />

        <div className="rounded-xl p-4 border bg-white mb-4" style={{ borderColor: T.line }}>
          <div className="text-sm font-bold mb-3">{editingId ? "تعديل عملية" : "إضافة عملية جديدة"}</div>
          <div className="grid grid-cols-3 gap-2 mb-2">
            {[{ v: "purchase", l: "شراء" }, { v: "payment", l: "تسديد" }, { v: "return", l: "ترجيع" }].map((t) => (
              <button key={t.v} onClick={() => setType(t.v)} className="py-2 rounded-lg text-sm font-bold border" style={{ borderColor: type === t.v ? T.accent : COLORS.line, background: type === t.v ? T.panel : "#fff", color: type === t.v ? T.text : COLORS.inkSoft }}>{t.l}</button>
            ))}
          </div>
          <input value={desc} onChange={(e) => setDesc(e.target.value)} placeholder="الوصف" className="w-full mb-2 px-3 py-2 rounded-lg border outline-none" style={{ borderColor: COLORS.line }} />
          <div className="flex gap-2 mb-3">
            <MoneyInput value={amount} onChange={setAmount} placeholder="المبلغ" className="flex-1 px-3 py-2 rounded-lg border outline-none" style={{ borderColor: COLORS.line }} />
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} className="px-3 py-2 rounded-lg border outline-none" style={{ borderColor: COLORS.line }} />
          </div>
          <div className="flex gap-2">
            <button onClick={saveEntry} className="flex-1 py-2 rounded-lg font-bold" style={{ background: T.accent, color: T.accentText }}>{editingId ? "حفظ التعديل" : "حفظ العملية"}</button>
            {editingId && <button onClick={resetForm} className="px-4 rounded-lg border" style={{ borderColor: COLORS.line }}>إلغاء</button>}
          </div>
        </div>

        <div className="text-sm font-bold mb-2">سجل العمليات</div>
        <HistoryControls search={histSearch} setSearch={setHistSearch} filter={histFilter} setFilter={setHistFilter} sort={histSort} setSort={setHistSort} color={T.accent} />
        <div className="space-y-2">
          {history.length === 0 && <div className="text-sm text-center py-4" style={{ color: COLORS.inkSoft }}>لا توجد عمليات بعد</div>}
          {history.map((e) => (
            <div key={e.id} className="flex items-center justify-between p-3 rounded-lg border bg-white" style={{ borderColor: COLORS.line }}>
              <div>
                <div className="text-sm font-semibold">#{numberMap[e.id]} — {e.type === "purchase" ? "شراء" : e.type === "payment" ? "تسديد" : "ترجيع"}{e.desc ? ` — ${e.desc}` : ""}</div>
                <div className="text-xs" style={{ color: COLORS.inkSoft }}>{fmtDate(e.date)}</div>
              </div>
              <div className="flex items-center gap-2">
                <div className="font-bold" style={{ color: e.type === "purchase" ? COLORS.brick : COLORS.olive }}>{e.type === "purchase" ? "+" : "-"}{fmtMoney(e.amount)}</div>
                {phone && phone.trim() && <button onClick={() => sendWaForEntry(e)} className="text-xs px-2 py-1 rounded font-semibold text-white" style={{ background: COLORS.waGreen }}>واتساب</button>}
                <button onClick={() => startEdit(e)} className="text-xs px-2 py-1 rounded font-semibold text-white" style={{ background: COLORS.steel }}>تعديل</button>
                <button onClick={() => deleteEntry(e.id)} className="text-xs px-2 py-1 rounded font-semibold text-white" style={{ background: COLORS.brick }}>حذف</button>
              </div>
            </div>
          ))}
        </div>
      </div>

      <CustomerSidePanel
        open={showSidePanel}
        onClose={() => setShowSidePanel(false)}
        phone={phone} setPhone={setPhone}
        ceiling={ceiling} setCeiling={setCeiling}
        onSavePhone={savePhone} onSaveCeiling={saveCeiling}
        phoneSaved={phoneSaved} ceilingSaved={ceilingSaved}
        lastSeen={lastSeen}
        onDelete={onDelete}
        onConvertMulti={onConvertMulti}
      />
    </div>
  );
}

/* ============ مجلد الزبون (لما عنده أكثر من حساب فرعي) ============ */
function CustomerFolder({ T, code, data, onBack, onSave }) {
  const subs = data.subAccounts || [];
  const [adding, setAdding] = useState(false);
  const [newName, setNewName] = useState("");
  const [openSub, setOpenSub] = useState(null);
  const [toast, setToast] = useState("");

  const flashToast = (t) => { setToast(t); setTimeout(() => setToast(""), 1800); };

  const addSub = async () => {
    if (!newName.trim()) return;
    const sub = { id: "sub_" + Date.now(), name: newName.trim(), ceiling: "", statsResetAt: null, entries: [] };
    await onSave({ ...data, subAccounts: [...subs, sub] });
    setNewName(""); setAdding(false);
    flashToast("تمت إضافة الحساب الفرعي");
  };

  const saveSub = async (subId, patch) => {
    const newSubAccounts = subs.map((s) => (s.id === subId ? { ...s, ceiling: patch.ceiling, statsResetAt: patch.statsResetAt, entries: patch.entries } : s));
    await onSave({ ...data, phone: patch.phone, subAccounts: newSubAccounts });
  };

  const deleteSub = async (subId) => {
    if (!window.confirm("متأكد تريد حذف هذا الحساب الفرعي نهائياً؟")) return;
    const newSubAccounts = subs.filter((s) => s.id !== subId);
    await onSave({ ...data, subAccounts: newSubAccounts });
    setOpenSub(null);
  };

  if (openSub) {
    const sub = subs.find((s) => s.id === openSub);
    if (!sub) { setOpenSub(null); return null; }
    return (
      <CustomerDetail
        T={T}
        code={code}
        data={{ name: `${data.name} — ${sub.name}`, phone: data.phone, ceiling: sub.ceiling, statsResetAt: sub.statsResetAt, entries: sub.entries }}
        onBack={() => setOpenSub(null)}
        onSave={(updated) => saveSub(openSub, updated)}
        onDelete={() => deleteSub(openSub)}
      />
    );
  }

  const subRows = subs.map((s) => {
    const { debt, lastPurchase, lastPayment } = computeTotals(s.entries);
    return { ...s, debt, lastPurchase, lastPayment, status: debtStatusColor(debt, s.ceiling) };
  });
  const totalDebt = subRows.reduce((sum, s) => sum + s.debt, 0);

  return (
    <div className="min-h-screen px-4 py-6" style={{ background: T.bg, color: T.text }}>
      <div className="max-w-md mx-auto">
        <button onClick={onBack} className="text-sm mb-4 font-semibold" style={{ color: T.text }}>← رجوع لكل الزبائن</button>

        <div className="mb-4">
          <div className="text-xl font-extrabold" style={{ fontFamily: "Cairo, sans-serif" }}>📁 {data.name}</div>
          <div className="text-xs mt-1" style={{ color: T.textSoft }}>كود مشترك: {code} — {subs.length} حسابات فرعية</div>
        </div>

        <div className="rounded-xl p-4 text-center mb-4" style={{ background: STATUS_COLORS[debtStatusColor(totalDebt, null)], color: STATUS_TEXT[debtStatusColor(totalDebt, null)] }}>
          <div className="text-xs mb-1" style={{ opacity: 0.85 }}>إجمالي كل الحسابات الفرعية</div>
          <div className="text-3xl font-extrabold">{fmtMoney(totalDebt)}</div>
        </div>

        {!adding ? (
          <button onClick={() => setAdding(true)} className="w-full mb-4 py-3 rounded-xl font-bold" style={{ background: T.accent, color: T.accentText }}>+ إضافة حساب فرعي</button>
        ) : (
          <div className="mb-4 p-4 rounded-xl border bg-white" style={{ borderColor: T.line }}>
            <input autoFocus value={newName} onChange={(e) => setNewName(e.target.value)} placeholder="اسم الحساب الفرعي (مثال: علي - بيت جديد)" className="w-full mb-3 px-3 py-2 rounded-lg border outline-none" style={{ borderColor: T.line }} onKeyDown={(e) => e.key === "Enter" && addSub()} />
            <div className="flex gap-2">
              <button onClick={addSub} className="flex-1 py-2 rounded-lg font-bold" style={{ background: T.accent, color: T.accentText }}>حفظ</button>
              <button onClick={() => { setAdding(false); setNewName(""); }} className="px-4 rounded-lg border" style={{ borderColor: T.line }}>إلغاء</button>
            </div>
          </div>
        )}

        <div className="space-y-2">
          {subRows.length === 0 && <div className="text-center text-sm py-8" style={{ color: T.textSoft }}>لا يوجد حسابات فرعية بعد</div>}
          {subRows.map((s) => (
            <button key={s.id} onClick={() => setOpenSub(s.id)} className="w-full text-right p-4 rounded-xl border bg-white flex items-center justify-between hover:opacity-90" style={{ borderColor: T.line, borderRightWidth: 5, borderRightColor: STATUS_COLORS[s.status] }}>
              <div>
                <div className="font-bold" style={{ color: COLORS.ink }}>{s.name}</div>
                <div className="text-xs" style={{ color: COLORS.inkSoft }}>{s.lastPurchase ? `آخر شراء ${fmtDate(s.lastPurchase.date)}` : ""}{s.lastPayment ? ` • آخر تسديد ${fmtDate(s.lastPayment.date)}` : ""}</div>
              </div>
              <div className="font-extrabold" style={{ color: STATUS_COLORS[s.status] }}>{fmtMoney(s.debt)}</div>
            </button>
          ))}
        </div>
      </div>

      {toast && <div className="fixed bottom-5 left-1/2 -translate-x-1/2 px-4 py-2 rounded-lg text-white text-sm" style={{ background: COLORS.ink }}>{toast}</div>}
    </div>
  );
}

/* ============ التطبيق الرئيسي ============ */
function App() {
  useFonts();
  const [mode, setMode] = useState("landing");
  const [customerCode, setCustomerCode] = useState(null);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);

  useEffect(() => {
    (async () => {
      try { const r = await storage.get("app-settings"); if (r) setSettings({ ...DEFAULT_SETTINGS, ...JSON.parse(r.value) }); } catch {}
    })();
    try {
      const params = new URLSearchParams(window.location.search);
      const c = params.get("c");
      if (c) { setCustomerCode(normalizeDigits(c)); setMode("customer"); }
    } catch {}
  }, []);

  const saveSettings = async (updated) => {
    try { await storage.set("app-settings", JSON.stringify(updated)); setSettings(updated); } catch {}
  };

  return (
    <div dir="rtl" style={{ fontFamily: "'IBM Plex Sans Arabic', Cairo, sans-serif" }}>
      {mode === "landing" && <Landing settings={settings} onEnterCustomer={(code) => { setCustomerCode(code); setMode("customer"); }} onEnterAdmin={() => setMode("admin")} />}
      {mode === "customer" && <CustomerView code={customerCode} onBack={() => setMode("landing")} settings={settings} />}
      {mode === "admin" && <AdminView onBack={() => setMode("landing")} settings={settings} onSaveSettings={saveSettings} />}
    </div>
  );
}
